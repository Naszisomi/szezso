<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>szezso</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; touch-action: pan-x pan-y; }
  /* a charton a csípés/húzás csak a chartot nagyítja, az oldalt nem (különben szétcsúszik a kép) */
  #views, #views * { touch-action: none; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px 6px; border-bottom: 1px solid #e5e5e5; }
  header .brand { font-weight: 700; margin-right: 6px; }
  .group { display: flex; gap: 4px; flex-wrap: wrap; }
  button { font-size: 13px; padding: 5px 8px; min-width: 36px; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #111; }
  /* összecsukott rétegsor: csak a kapcsológomb látszik */
  #layers.closed button:not(.tog) { display: none; }
  button.tog { background: #f3f3f3; }
  button.on { background: #111; color: #fff; border-color: #111; }
  .sep { width: 1px; height: 20px; background: #ddd; margin: 0 4px; }
  .live { width: 12px; height: 12px; border-radius: 50%; background: #bbb; display: inline-block; margin-left: auto; }
  .live.ok { background: #089981; } .live.connecting { background: #F5A623; } .live.down { background: #F23645; }
  .status { font-size: 13px; color: #666; } .status.err { color: #C62828; }
  #tabs button { font-size: 13px; padding: 5px 8px; }
  #tabs button.multi { border-style: dashed; }
  #tabs button.multi.on { border-style: solid; }
  #views { flex: 1; display: flex; min-height: 0; }
  .view { flex: 1; display: grid; min-height: 0; min-width: 0; gap: 1px; background: #e5e5e5; }
  .cell { position: relative; min-width: 0; min-height: 0; background: #fff; }
  .view.single { grid-template: 1fr / 1fr; }
  .view.data { display: block; overflow: auto; background: #fff; padding: 12px 16px; font-size: 15px; color: #222; touch-action: pan-x pan-y !important; }
  .view.data * { touch-action: pan-x pan-y !important; }
  .view.data h2 { margin: 4px 0 6px; font-size: 20px; } .view.data h3 { margin: 18px 0 6px; font-size: 17px; }
  .view.data .big { font-size: 17px; } .view.data .muted { color: #787B86; font-size: 13px; }
  .view.data .up { color: #089981; } .view.data .dn { color: #F23645; }
  .view.data table { border-collapse: collapse; margin: 4px 0; } .view.data td, .view.data th { border-bottom: 1px solid #eee; padding: 4px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
  .view.data table.plan { font-size: 14px; } .view.data th { color: #555; font-weight: 600; }
  .view.data li { margin: 3px 0; }
  .view.six { grid-template: repeat(2, 1fr) / repeat(3, 1fr); }
  .view.three { grid-template: 1fr 1fr / 2fr 1fr; }
  .view.three .c0 { grid-row: 1 / 3; }
  .ctitle { position: absolute; top: 4px; left: 8px; z-index: 3; font-size: 13px; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 6px; pointer-events: none; }
  .ctitle.small { font-size: 12px; }
  .ctitle .acc { background: #111; color: #fff; border-radius: 4px; padding: 0 5px; font-weight: 600; }
  @media (orientation: portrait) {
    .view.six { grid-template: repeat(3, 1fr) / repeat(2, 1fr); }
    .view.three { grid-template: 2fr 1fr / 1fr 1fr; }
    .view.three .c0 { grid-row: 1; grid-column: 1 / 3; }
  }
</style>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <span class="brand">szezso</span>
  <div class="group" id="tfs"></div>
  <span class="sep"></span>
  <div class="group" id="layers"></div>
  <span class="status" id="status"></span>
  <span class="live" id="live" title="Kapcsolódás…"></span>
</header>
<header>
  <div class="group" id="tabs"></div>
</header>
<div id="views"></div>
</body>
</html>
