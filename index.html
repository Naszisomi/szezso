<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>szezso</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #e5e5e5; }
  header .brand { font-weight: 700; margin-right: 6px; }
  .group { display: flex; gap: 4px; flex-wrap: wrap; }
  button { font-size: 15px; padding: 8px 12px; min-width: 44px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #111; }
  button.on { background: #111; color: #fff; border-color: #111; }
  .sep { width: 1px; height: 26px; background: #ddd; margin: 0 4px; }
  .live { width: 12px; height: 12px; border-radius: 50%; background: #bbb; display: inline-block; margin-left: auto; }
  .live.ok { background: #089981; } .live.connecting { background: #F5A623; } .live.down { background: #F23645; }
  .status { font-size: 13px; color: #666; } .status.err { color: #C62828; }
  #accounts button { font-size: 14px; padding: 7px 10px; }
  main { flex: 1; display: flex; min-height: 0; }
  #cMain { flex: 1; position: relative; min-width: 0; }
  #side { width: 32%; display: flex; flex-direction: column; border-left: 1px solid #e5e5e5; }
  #side > div { flex: 1; position: relative; min-height: 0; }
  #side > div + div { border-top: 1px solid #e5e5e5; }
  body.noside #side { display: none; }
  .ctitle { position: absolute; top: 4px; left: 8px; z-index: 3; font-size: 13px; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 6px; pointer-events: none; }
  #note { font-size: 12px; color: #888; padding: 2px 8px 4px; }
  @media (orientation: portrait) {
    main { flex-direction: column; }
    #side { width: 100%; height: 34%; flex-direction: row; border-left: 0; border-top: 1px solid #e5e5e5; }
    #side > div + div { border-top: 0; border-left: 1px solid #e5e5e5; }
  }
</style>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <span class="brand">szezso</span>
  <div class="group" id="tfs"></div>
  <span class="sep"></span>
  <button id="sideBtn" title="BTC és ETH kiegészítő chart">BTC/ETH</button>
  <span class="status" id="status"></span>
  <span class="live" id="live" title="Kapcsolódás…"></span>
</header>
<header>
  <span style="font-size:13px;color:#666">Számla:</span>
  <div class="group" id="accounts"></div>
</header>
<div id="note">A számlafülek most még üresek – a papírkereskedés a 7. lépésben kerül rájuk.</div>
<main>
  <div id="cMain"></div>
  <div id="side"><div id="cBTC"></div><div id="cETH"></div></div>
</main>
</body>
</html>
